name: Film promo reels

# Posts a film's vertical promo reels (promos/<film>/promo.json): YouTube Shorts first, then
# Facebook, Instagram, Threads and Bluesky, each with a link to the full film on YouTube.
# Runs only when a promo manifest changes; its "stage" decides how far the run goes.
on:
  push:
    branches: ["claude/**"]
    paths: ["promos/*/promo.json"]

permissions:
  contents: write

concurrency:
  group: promo
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/checkout@v4
        with: {path: branch}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Join films split into parts (GitHub refuses files over 100 MB)
        run: |
          for p in branch/promos/*/*.mp4.part-0; do [ -e "$p" ] || continue; cat "${p%.part-0}".part-* > "${p%.part-0}"; ls -la "${p%.part-0}"; done
      - name: Publish the reels as a release (Instagram and Threads fetch them from there)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for m in branch/promos/*/promo.json; do
            d=$(dirname "$m"); tag=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['release'])" "$m")
            [ "$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['stage'])" "$m")" = "all" ] || continue
            if gh release view "$tag" >/dev/null 2>&1; then gh release upload "$tag" "$d"/*reel*.mp4 --clobber
            else gh release create "$tag" "$d"/*reel*.mp4 --target main --title "$tag" --notes "Vertical promo reels for the film."; fi
          done
      - name: Post
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          for m in branch/promos/*/promo.json; do PYTHONPATH=. python branch/promos/post.py "$m"; done
