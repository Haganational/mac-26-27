name: Collect lines and publish dashboard

on:
  schedule:
    # Three snapshots a day, UTC: ~7am ET (overnight openers), ~1pm ET, ~6pm ET (pre-tip).
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh schedule, snapshot lines, render site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional repo variables (Settings > Secrets and variables > Actions > Variables):
          # SITE_URL for a custom domain, SITE_NOINDEX=1 to keep search engines out.
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: python -m mac.collect all
      - name: Commit new data
        run: |
          git config user.name "mac-collector"
          git config user.email "mac-collector@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
