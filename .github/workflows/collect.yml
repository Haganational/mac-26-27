name: Collect lines and publish dashboard

on:
  schedule:
    # A line snapshot every 30 minutes, to pin down when each book posts.
    # The :00 runs at 12, 18 and 23 UTC (~7am, 1pm, 6pm ET) also refresh schedule, results, ratings and news.
    # GitHub often drops these on small repos, so heartbeat.yml is the real clock; this stays as a backup.
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "tick = the half-hourly snapshot; live = game-night live scores, ESPN only (both sent by heartbeat.yml); blank = full refresh"
        required: false
        default: ""
  # A new or edited Fieldhouse Notes dispatch republishes the site right away.
  # That run only re-renders (no ESPN or odds calls), so it costs no API quota.
  push:
    branches: [main]
    paths: ["notes/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh schedule, snapshot lines, render site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # ACCESS_CODE locks the Bettor's Desk screens (odds, data viz, best number). One code per line; any opens all.
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          # Optional repo variables (Settings > Secrets and variables > Actions > Variables):
          # SITE_URL for a custom domain, SITE_NOINDEX=1 to keep search engines out.
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m mac.collect site
          elif [ "${{ inputs.mode }}" = "live" ]; then
            python -m mac.collect live
          elif { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "tick" ]; } && ! { case "$(date -u +%H)" in 12|18|23) [ "$(date -u +%M)" -lt 15 ];; *) false;; esac; }; then
            python -m mac.collect quick
          else
            python -m mac.collect all
          fi
      - name: ASUN edition (hardwoodbricks.com/asun/)
        # Its lines came with the MAC run's odds pull above, so this step never calls the Odds API.
        # A failure here is logged but never blocks the MAC site from publishing.
        continue-on-error: true
        env:
          LEAGUE: asun
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m mac.collect site
          elif [ "${{ inputs.mode }}" = "live" ] || { { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "tick" ]; } && ! { case "$(date -u +%H)" in 12|18|23) [ "$(date -u +%M)" -lt 15 ];; *) false;; esac; }; }; then
            python -m mac.collect live
          else
            python -m mac.collect edition
          fi
      - name: Horizon League edition (hardwoodbricks.com/horizon/)
        # Its lines came with the MAC run's odds pull above, so this step never calls the Odds API.
        # A failure here is logged but never blocks the MAC site from publishing.
        continue-on-error: true
        env:
          LEAGUE: horizon
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m mac.collect site
          elif [ "${{ inputs.mode }}" = "live" ] || { { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "tick" ]; } && ! { case "$(date -u +%H)" in 12|18|23) [ "$(date -u +%M)" -lt 15 ];; *) false;; esac; }; }; then
            python -m mac.collect live
          else
            python -m mac.collect edition
          fi
      - name: Mountain West edition (hardwoodbricks.com/mw/)
        # Its lines came with the MAC run's odds pull above, so this step never calls the Odds API.
        # A failure here is logged but never blocks the MAC site from publishing.
        continue-on-error: true
        env:
          LEAGUE: mw
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m mac.collect site
          elif [ "${{ inputs.mode }}" = "live" ] || { { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "tick" ]; } && ! { case "$(date -u +%H)" in 12|18|23) [ "$(date -u +%M)" -lt 15 ];; *) false;; esac; }; }; then
            python -m mac.collect live
          else
            python -m mac.collect edition
          fi
      - name: All-conference front page (hardwoodbricks.com/)
        # After the editions, so the hub shows every conference's latest games.
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: python -m mac.collect hub
      - name: Post new recaps and previews to Bluesky
        # Does nothing until the BSKY_HANDLE and BSKY_APP_PASSWORD secrets are set.
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python -m mac.collect social
      - name: Commit new data
        run: |
          git config user.name "mac-collector"
          git config user.email "mac-collector@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # A merge or a Notes dispatch can land on main mid-run; replay the data commit on top instead of failing the deploy.
          git push || { git pull --rebase origin main && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
