name: Collect lines and publish dashboard

on:
  schedule:
    # A line snapshot every 30 minutes, to pin down when each book posts.
    # The :00 runs at 12, 18 and 23 UTC (~7am, 1pm, 6pm ET) also refresh schedule, results, ratings and news.
    - cron: "0,30 * * * *"
  workflow_dispatch:
  # A new or edited Fieldhouse Notes dispatch republishes the site right away.
  # That run only re-renders (no ESPN or odds calls), so it costs no API quota.
  push:
    branches: [main]
    paths: ["notes/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh schedule, snapshot lines, render site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional repo variables (Settings > Secrets and variables > Actions > Variables):
          # SITE_URL for a custom domain, SITE_NOINDEX=1 to keep search engines out.
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m mac.collect site
          elif [ "${{ github.event_name }}" = "schedule" ] && ! { case "$(date -u +%H)" in 12|18|23) [ "$(date -u +%M)" -lt 15 ];; *) false;; esac; }; then
            python -m mac.collect quick
          else
            python -m mac.collect all
          fi
      - name: Commit new data
        run: |
          git config user.name "mac-collector"
          git config user.email "mac-collector@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
