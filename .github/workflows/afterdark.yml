name: MAC After Dark assets

# One-off: when afterdark/ changes on a claude/ branch, fetch freely licensed Commons
# photos and voice afterdark/script.json in Matthew's cloned voice, then commit both back
# to the branch so the Short can be assembled. Remove after the episode ships.
on:
  push:
    branches: ["claude/**"]
    paths: ["afterdark/script.json", "afterdark/photos.json", ".github/workflows/afterdark.yml"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Photos
        run: python tools/afterdark_fetch.py afterdark/photos.json afterdark/photos
      - name: Voice reference
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          export VOICE_KEY="$(printf %s "$VOICE_KEY" | tr -d '[:space:]')"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICE_KEY -in voices/matthew.ogg.enc -out /tmp/ref.ogg
          ffmpeg -loglevel error -y -i /tmp/ref.ogg -ac 1 -ar 24000 /tmp/ref.wav && rm /tmp/ref.ogg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-turbo-v1
      - name: Voice
        run: |
          python -m venv /tmp/cbenv
          /tmp/cbenv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu" "torchaudio==2.6.0+cpu" chatterbox-tts "setuptools<81"
          mkdir -p afterdark/voice
          python -c "import json; print(json.dumps([{'text': s['say'], 'out': 'afterdark/voice/' + s['id'] + '.wav'} for s in json.load(open('afterdark/script.json'))]))" > /tmp/jobs.json
          /tmp/cbenv/bin/python tools/clone_voice.py --ref /tmp/ref.wav --jobs /tmp/jobs.json
          rm /tmp/ref.wav
      - name: Commit back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afterdark/photos afterdark/voice
          git commit -m "After Dark: photos and voice [skip ci]" && git push
