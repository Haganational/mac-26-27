name: MidMaxx60 video

# Every morning at 8 a.m. Eastern (13:00 UTC in winter, 12:00 UTC in summer): build the
# MidMaxx60 script from the latest data, voice it, render vertical cards, and publish the MP4,
# captions, thumbnail and description as a GitHub release, then upload it to YouTube as a Short.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["mac/midmaxx60.py", "mac/today.py", "templates/midmaxx60_card.html", "tools/clone_voice.py", "voices/**", ".github/workflows/midmaxx60.yml"]

permissions:
  contents: write

concurrency:
  group: midmaxx60
  cancel-in-progress: false

env:
  VOICE: en_US-ryan-high

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # enough history to date the last data snapshot for the freshness check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt piper-tts
      - name: Fonts and ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation >/dev/null
      - name: Cache the Piper voice
        uses: actions/cache@v4
        with:
          path: |
            voices/*.onnx
            voices/*.onnx.json
          key: piper-${{ env.VOICE }}
      - name: Download the Piper voice
        run: |
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          [ -f voices/$VOICE.onnx ] || curl -sSfL -o voices/$VOICE.onnx $base/$VOICE.onnx
          [ -f voices/$VOICE.onnx.json ] || curl -sSfL -o voices/$VOICE.onnx.json $base/$VOICE.onnx.json
      # Matthew's cloned voice. His reference clip is committed only encrypted
      # (voices/matthew.ogg.enc); the key is the VOICE_KEY repo secret. Without both,
      # the video uses Piper. Pull requests clone a Piper sample instead, to test the path.
      - name: Voice reference
        id: ref
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          # Pasted secrets can pick up a stray newline or space; the key is plain hex.
          export VOICE_KEY="$(printf %s "$VOICE_KEY" | tr -d '[:space:]')"
          if [ -n "$VOICE_KEY" ] && [ -f voices/matthew.ogg.enc ] \
             && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICE_KEY -in voices/matthew.ogg.enc -out /tmp/ref.ogg; then
            ffmpeg -loglevel error -y -i /tmp/ref.ogg -ac 1 -ar 24000 /tmp/ref.wav && rm /tmp/ref.ogg
            echo "Using Matthew's voice reference"
            echo "clone=yes" >> "$GITHUB_OUTPUT"
          elif [ -n "$VOICE_KEY" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::warning::VOICE_KEY did not open voices/matthew.ogg.enc; using Piper"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            [ -n "$VOICE_KEY" ] && echo "::warning::VOICE_KEY did not open voices/matthew.ogg.enc; testing with a Piper sample"
            echo "This is Mid Max Sixty, the Mid-American Conference in sixty seconds. Western Michigan beat Campbell eighty seven to seventy one last night, and Bowling Green hosts Cleveland State tonight at seven." \
              | python -m piper -m voices/$VOICE.onnx -f /tmp/ref.wav
            echo "clone=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache the clone model
        if: steps.ref.outputs.clone == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-turbo-v1
      - name: Install Chatterbox (CPU)
        if: steps.ref.outputs.clone == 'yes'
        run: |
          python -m venv /tmp/cbenv
          /tmp/cbenv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu" "torchaudio==2.6.0+cpu" chatterbox-tts "setuptools<81"
          /tmp/cbenv/bin/python -c "import perth; print('watermarker:', perth.PerthImplicitWatermarker)"
          echo "VOICE_CLONE_PY=/tmp/cbenv/bin/python" >> "$GITHUB_ENV"
          echo "VOICE_REF=/tmp/ref.wav" >> "$GITHUB_ENV"
      - name: Build the script (render only, no API calls)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m mac.collect site
      # Stale or empty data: skip today's video and email Matthew instead of publishing old news.
      # Pull requests always render, to test the path.
      - name: Skip and alert on stale data
        id: fresh
        if: github.event_name != 'pull_request'
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: |
          python -m mac.midmaxx60 --check --data-time "$(git log -1 --format=%cI -- data/)"
      - name: Render the video
        if: steps.fresh.outputs.skip != 'yes'
        env:
          PIPER_VOICE: voices/${{ env.VOICE }}.onnx
          CHROME_BIN: /usr/bin/google-chrome
        run: python -m mac.midmaxx60 --out out
      - uses: actions/upload-artifact@v4
        if: steps.fresh.outputs.skip != 'yes'
        with:
          name: midmaxx60
          path: out/midmaxx60-*
      - name: Publish as a release
        if: github.event_name != 'pull_request' && steps.fresh.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stem=$(basename out/midmaxx60-*.mp4 .mp4)
          tag="$stem"
          files="out/$stem.mp4 out/$stem.srt out/$stem-thumb.png out/$stem.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "MidMaxx60 · ${stem#midmaxx60-}" --notes-file "out/$stem.txt"
          fi
      # Needs the YT_* secrets from the channel owner; without them this warns and moves on.
      - name: Upload to YouTube
        if: github.event_name != 'pull_request' && steps.fresh.outputs.skip != 'yes'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: python -m mac.youtube --out out
