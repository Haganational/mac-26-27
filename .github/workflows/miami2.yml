name: Miami deco

# One-off: more Commons material (Ocean Drive deco photos and clips). Remove after the Short ships.
on:
  push:
    branches: ["claude/**"]
    paths: ["miami/deco.json", "miami/videos2.json", ".github/workflows/miami2.yml"]

permissions:
  contents: write

jobs:
  deco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/commons_fetch.py miami/deco.json miami/deco
      - run: python tools/commons_video_fetch.py miami/videos2.json miami/videos2
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miami/deco miami/videos2
          git commit -m "Miami: deco photos and clips [skip ci]" && git pull -q --rebase origin "$GITHUB_REF_NAME" && git push
