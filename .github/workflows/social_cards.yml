name: Social cards

# Every morning the image posts go out one at a time, spaced 40 to 60 minutes apart at slightly
# different minutes each day (a fixed posting clock reads as a bot):
#   ~8:35 AM ET  Players of the Night (last night)    ~9:25  Bricked (last night's biggest miss)
#   ~10:15       Tonight's Four                       ~11:05 Beat the Desk (before the first tip)
# Each card is drawn from the freshest data just before it posts (mac/cards.py), its images are
# attached to the day's GitHub release (Instagram and Threads fetch them from there), and
# mac/cardpost.py posts it. The heartbeat starts this at 13:30 UTC; the cron is the backup, and a
# second start the same day stops at once. Run it by hand with a kind to post that card now.
on:
  schedule:
    - cron: "35 13 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "all (paced through the morning) or one card to post now"
        default: all
        type: choice
        options: [all, potn, bricked, slate, desk]
  pull_request:
    paths: ["mac/cards.py", "mac/studio.py", "sets/**", "mac/cardpost.py", ".github/workflows/social_cards.yml"]

permissions:
  contents: write

concurrency:
  group: social-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      ALERT_TO: ${{ vars.ALERT_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Pull requests only draw today's cards (no release, no posts) and keep them as an artifact.
      - name: Draw the cards (pull request check)
        if: github.event_name == 'pull_request'
        run: python -m mac.cards --kind all --out out/cards
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: social-cards
          path: out/cards
      - name: Draw and post, one card at a time
        if: github.event_name != 'pull_request'
        run: |
          day=$(TZ=America/New_York date +%F)
          tag="cards-$day"
          kind="${{ github.event.inputs.kind || 'all' }}"
          if [ "$kind" = "all" ]; then
            if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx started.txt; then
              echo "Today's cards already started in another run; stopping."; exit 0
            fi
            kinds="potn bricked slate desk"
          else
            kinds="$kind"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Social cards · $day" --notes "Images for the day's social posts (mac/cards.py)."
          if [ "$kind" = "all" ]; then
            date -u > started.txt && gh release upload "$tag" started.txt --clobber
          fi
          failed=0
          first=1
          for k in $kinds; do
            if [ "$kind" = "all" ]; then
              if [ $first = 1 ]; then pause=$(( RANDOM % 600 )); else pause=$(( 2400 + RANDOM % 1200 )); fi
              echo "Waiting $((pause / 60)) minutes before $k"; sleep $pause
            fi
            first=0
            git pull -q --ff-only origin main || echo "::warning::could not pull fresh data; using the checkout"
            rm -rf out/cards && python -m mac.cards --kind "$k" --date "$day" --out out/cards || { failed=1; continue; }
            [ -f "out/cards/$k.json" ] || continue
            gh release upload "$tag" out/cards/$k-*.jpg --clobber
            python -m mac.cardpost --dir out/cards --kind "$k" --tag "$tag" || failed=1
          done
          exit $failed
