name: Episode three assets

# One-off: Commons photos (living room, Croatia, Dayton) and audio (laugh track, phone bell)
# for a studio Short. Remove after the Short ships.
on:
  push:
    branches: ["claude/**"]
    paths: ["ep3/photos.json", "ep3/audio.json", "tools/commons_audio_fetch.py", ".github/workflows/ep3.yml"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/commons_fetch.py ep3/photos.json ep3/photos
      - run: sleep 60 && python tools/commons_audio_fetch.py ep3/audio.json ep3/audio
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ep3
          git commit -m "Episode three: Commons photos and audio [skip ci]" && git pull -q --rebase origin "$GITHUB_REF_NAME" && git push
