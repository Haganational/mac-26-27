name: Publish a one-off video release

# One-off: files committed under release/ on a claude/ branch become a GitHub pre-release
# named after the MP4 so Matthew gets a one-tap download link. Remove afterward.
on:
  push:
    branches: ["claude/**"]
    paths: ["release/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mp4=$(ls release/*.mp4 2>/dev/null | head -1)
          [ -n "$mp4" ] || { echo "nothing to publish"; exit 0; }
          tag=$(basename "$mp4" .mp4)
          gh release view "$tag" >/dev/null 2>&1 && gh release upload "$tag" "$mp4" --clobber || \
            gh release create "$tag" "$mp4" --prerelease --target "$GITHUB_SHA" --title "$tag" --notes-file release/notes.txt
