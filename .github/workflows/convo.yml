name: Convo photos

# One-off: fetch freely licensed Commons photos of Ohio University's Convocation Center
# (Commons isn't reachable from Claude's container). Remove after the studio set ships.
on:
  push:
    branches: ["claude/**"]
    paths: ["convo/photos.json", ".github/workflows/convo.yml"]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/commons_fetch.py convo/photos.json convo/photos
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convo/photos
          git commit -m "Convo: Commons photos [skip ci]" && git push
