name: Fetch full-res images
on:
  push:
    branches: ["claude/**"]
    paths: ["docs/*/fetch_list.json"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: |
          d=$(git diff --name-only HEAD~1 HEAD | sed -n 's#^docs/\([^/]*\)/fetch_list.json#\1#p' | head -1)
          echo "DOC=docs/${d:-oneil-liv}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - run: python tools/fetch_full.py "$DOC/fetch_list.json" "$DOC/full"
      - run: |
          git config user.name "docs-scout"; git config user.email "actions@users.noreply.github.com"
          git add "$DOC/full"; git commit -m "docs: full-res images for $DOC" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
