name: Episode four assets

# One-off: Commons photos and clips plus a small map for a studio Short. Remove after the Short ships.
on:
  push:
    branches: ["claude/**"]
    paths: ["ep4/photos.json", "ep4/videos.json", ".github/workflows/ep4.yml"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python tools/osm_tiles.py 41.405 -72.895 13 4 7 ep4/map13.png && python tools/osm_tiles.py 41.419 -72.894 15 4 7 ep4/map15.png
        continue-on-error: true
      - run: python tools/commons_fetch.py ep4/photos.json ep4/photos
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ep4
          git commit -m "Episode four: map and Commons photos [skip ci]" && git pull -q --rebase origin "$GITHUB_REF_NAME" && git push
      - run: sleep 45 && python tools/commons_video_fetch.py ep4/videos.json ep4/videos
        continue-on-error: true
      - if: always()
        run: |
          git add ep4
          git commit -m "Episode four: Commons clips [skip ci]" && git pull -q --rebase origin "$GITHUB_REF_NAME" && git push || true
