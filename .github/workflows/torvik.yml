name: Torvik CSV pull (research only)

# One-off pull of Bart Torvik's CSV exports for the blend backtest. Only the CSVs that
# barttorvik.com/robots.txt allows, 10 s apart (its crawl delay). Not on a schedule.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Season ending years, space-separated"
        default: "2026 2027"
  push:
    branches: [claude/project-thread-w3na8f]
    paths: [".github/workflows/torvik.yml"]

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m mac.torvik fetch ${{ inputs.years || '2026 2027' }}
      - name: Commit raw files
        run: |
          git config user.name "mac-collector"
          git config user.email "mac-collector@users.noreply.github.com"
          git add data/torvik/
          git diff --cached --quiet && echo "nothing fetched" || git commit -m "data: Torvik CSV pull $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
