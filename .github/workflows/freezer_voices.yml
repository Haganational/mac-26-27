name: Freezer Hearing voices

# Sketch-only: voices sketches/freezer-hearing/lines.json with Gemini TTS on this branch and commits
# the takes to sketches/freezer-hearing/audio/. Not for main.
on:
  push:
    branches: [claude/project-thread-04lxpf]
    paths: [sketches/freezer-hearing/lines.json, sketches/freezer-hearing/clone_jobs.py, sketches/freezer-hearing/.rerun, .github/workflows/freezer_voices.yml]

permissions:
  contents: write

concurrency:
  group: freezer-voices
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -q ffmpeg
      - name: Cache the clone model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-turbo-v1
      - name: Install Chatterbox (CPU)
        run: |
          python -m venv /tmp/cbenv
          /tmp/cbenv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu" "torchaudio==2.6.0+cpu" chatterbox-tts "setuptools<81"
      - name: Clone the missing takes from each anchor's audition
        continue-on-error: true
        run: |
          mkdir -p /tmp/auditions
          for f in voices/anchors/*.ogg; do ffmpeg -loglevel error -y -i "$f" -ac 1 -ar 24000 "/tmp/auditions/$(basename "$f" .ogg).wav"; done
          python sketches/freezer-hearing/clone_jobs.py
          /tmp/cbenv/bin/python tools/clone_voice.py --jobs /tmp/voice-jobs.json
      - name: Commit
        if: always()
        run: |
          git config user.name "mac-collector"
          git config user.email "mac-collector@users.noreply.github.com"
          git add sketches/freezer-hearing/audio/
          git diff --cached --quiet && echo "no new takes" && exit 0
          git commit -m "sketch: freezer hearing takes"
          git push
