name: lock call

# Posts one Lock Call episode's video to Bluesky. By hand only: nothing here runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id from data/podcast/episodes.json (blank = newest)"
        required: false

jobs:
  bluesky:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Post to Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          EPISODE: ${{ inputs.episode }}
        run: python -m mac.lockcall bluesky "$EPISODE"
