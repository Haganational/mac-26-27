name: Mateo post

# Posts to Mateo Sandoval's own YouTube channel, only on request: push a mateo/<slug>/post.json
# with "go": true (or run this by hand). Hardwood Bricks remains the default channel for every
# scheduled upload; this is the only workflow that reads YT_REFRESH_TOKEN_MATEO.
on:
  push:
    paths: ["mateo/**/post.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mateo-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build long videos (folders with build.py, marked go, not yet posted)
        run: |
          for d in mateo/*/; do
            [ -f "$d/build.py" ] && [ ! -f "$d/video.mp4" ] || continue
            python - "$d" <<'PY' || continue
          import json, sys, pathlib
          p = json.loads((pathlib.Path(sys.argv[1]) / "post.json").read_text())
          sys.exit(0 if p.get("go") and not p.get("youtube_id") else 1)
          PY
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
            pip install -q scipy
            python "$d/build.py" "$(python -c "import json,sys;print(json.load(open(sys.argv[1]+'/post.json')).get('hours',8))" "$d")" "$d/video.mp4"
          done
      - name: Upload to Mateo's channel
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MATEO: ${{ secrets.YT_REFRESH_TOKEN_MATEO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m mac.mateo_post
      - name: Record what went up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add mateo/*/post.json
          git diff --cached --quiet || (git commit -m "Mateo: record posted video [skip ci]" && git push)
